<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PakistanProperty — Listing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/pprealestate/assets/pp.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  .container { max-width: 1200px; margin: 0 auto; padding: 88px 24px 60px; }
  .crumbs { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .crumbs a:hover { color: var(--green); text-decoration: underline; }

  .listing-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .listing-title { font-size: 26px; font-weight: 800; color: var(--text-high); line-height: 1.25; }
  .listing-meta { display: flex; align-items: center; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
  .listing-meta .star { color: var(--text-high); font-weight: 700; }
  .listing-meta a { text-decoration: underline; }
  .listing-actions { display: flex; gap: 8px; }
  .pill-btn { display:flex; align-items:center; gap:6px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600; color: var(--text-mid); transition: background .15s; }
  .pill-btn:hover { background: var(--bg); }

  .gallery {
    display: grid; grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: 200px 200px;
    gap: 8px; border-radius: var(--radius-lg); overflow: hidden;
    margin-bottom: 28px;
  }
  .gallery .g-img { width:100%; height:100%; object-fit: cover; cursor: pointer; transition: opacity .2s; }
  .gallery .g-img:hover { opacity: .92; }
  .gallery .g0 { grid-row: 1 / span 2; }
  .g-more { position: relative; }
  .g-more-btn {
    position: absolute; bottom: 12px; right: 12px;
    background: var(--white); color: var(--text-high);
    padding: 6px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700;
    box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  }

  .listing-grid { display: grid; grid-template-columns: 1fr 360px; gap: 40px; align-items: start; }
  @media (max-width: 900px) { .listing-grid { grid-template-columns: 1fr; } }

  .section { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .section:first-child { padding-top: 0; }
  .section-title { font-size: 18px; font-weight: 800; color: var(--text-high); margin-bottom: 14px; }
  .lead { font-size: 14px; color: var(--text-mid); line-height: 1.65; }

  .host-row { display: flex; align-items: center; gap: 14px; }
  .host-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--green-light); color: var(--green); display: flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
    border: 2px solid var(--green);
  }
  .host-meta { font-size: 12.5px; color: var(--text-muted); }
  .host-meta strong { display: block; font-size: 15px; color: var(--text-high); font-weight: 700; margin-bottom: 2px; }

  .feature-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 600px) { .feature-grid { grid-template-columns: repeat(2, 1fr); } }
  .feature {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 14px; text-align: center;
  }
  .feature .fv { font-size: 18px; font-weight: 800; color: var(--text-high); }
  .feature .fl { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  .amenity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .amenity {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border-faint); border-radius: var(--radius-sm);
    font-size: 13px; color: var(--text-mid);
  }
  .amenity svg { color: var(--green); }

  /* Reviews */
  .rev-summary { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .rev-score { font-size: 38px; font-weight: 800; color: var(--text-high); line-height: 1; }
  .rev-meta { font-size: 13px; color: var(--text-muted); }
  .review-list { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .review-list { grid-template-columns: 1fr; } }
  .review { padding: 14px 0; }
  .review .ra { display:flex; gap: 10px; align-items: center; margin-bottom: 6px; }
  .review .ra .av { width: 36px; height: 36px; border-radius: 50%; background: var(--green-light); color: var(--green); display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 12.5px; }
  .review .rn { font-size: 13px; font-weight: 700; color: var(--text-high); }
  .review .rd { font-size: 11.5px; color: var(--text-faint); }
  .review p { font-size: 13px; color: var(--text-mid); line-height: 1.55; }

  #detailMap { height: 320px; width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--border); }

  /* Agent / Contact sidebar */
  .contact-card {
    position: sticky; top: 88px;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-md);
  }
  .price-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .price-head .v { font-size: 26px; font-weight: 800; color: var(--green); }
  .price-head .v span { font-size: 13px; font-weight: 400; color: var(--text-muted); }
  .price-head .r { font-size: 13px; color: var(--text-muted); }
  .price-head .r .star { color: var(--text-high); }
  .price-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

  .agent-block {
    display: flex; gap: 12px; align-items: center;
    background: var(--bg); border-radius: var(--radius-md);
    padding: 12px; margin-bottom: 14px;
  }
  .agent-block .av {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--green-light); color: var(--green);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
    border: 1.5px solid var(--green); flex-shrink: 0;
  }
  .agent-block .n { font-size: 14px; font-weight: 800; color: var(--text-high); }
  .agent-block .ag { font-size: 11.5px; color: var(--text-muted); }
  .agent-block .rt { font-size: 11px; color: var(--green); font-weight: 700; margin-top: 2px; }

  .contact-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .cta-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 12px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 700; transition: all .15s;
  }
  .cta-call { background: var(--green); color: #fff; }
  .cta-call:hover { background: var(--green-hover); }
  .cta-wapp { background: #25D366; color: #fff; }
  .cta-wapp:hover { background: #1da953; }
  .cta-msg  { border: 1.5px solid var(--border); color: var(--text-mid); background: var(--white); grid-column: span 2; }
  .cta-msg:hover { border-color: var(--green); color: var(--green); }

  .price-rows { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--border-faint); }
  .price-rows .r { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: var(--text-mid); }
  .price-rows .r .v { color: var(--text-high); font-weight: 600; }

  .badges-mini { display: flex; gap: 6px; margin: 8px 0 18px; flex-wrap: wrap; }
  .badges-mini span {
    background: var(--green-faint); color: var(--green);
    padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 700;
    border: 1px solid rgba(26,107,42,.18);
  }

  /* Mortgage */
  .mort {
    background: var(--bg); border-radius: var(--radius-md);
    padding: 14px; margin-top: 14px;
  }
  .mort .mhead { font-size: 12px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; }
  .mort .mrow  { display:flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; color: var(--text-mid); }
  .mort .mrow strong { color: var(--text-high); }
  .mort input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; outline: none; }
  .mort input:focus { border-color: var(--green); }
  .mort .mtotal { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display:flex; justify-content: space-between; font-size: 14px; font-weight: 800; color: var(--green); }

  .ps-pin-wrap { background: transparent; border: 0; }
  .ps-pin {
    background: var(--green); color: #fff; border: 2px solid #fff;
    padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
    box-shadow: var(--shadow-md); white-space: nowrap; text-align: center;
  }
</style>
</head>

      <div class="section">
        <div class="host-row">
          <div class="host-avatar">${l.agent.name.charAt(0)}</div>
          <div>
            <div class="host-meta"><strong>${l.type} listed by ${l.agent.name}</strong>${l.bedrooms>0?l.bedrooms+' beds · '+l.bathrooms+' baths · ':''}${l.sizeText} · ${l.area}${l.yearBuilt?' · Built '+l.yearBuilt:''}</div>
          </div>
        </div>
      </div>

      <!-- Key features -->
      <div class="section">
        <div class="feature-grid">
          ${l.bedrooms>0 ? `<div class="feature"><div class="fv">${l.bedrooms}</div><div class="fl">Bedrooms</div></div>` : ''}
          ${l.bathrooms>0 ? `<div class="feature"><div class="fv">${l.bathrooms}</div><div class="fl">Bathrooms</div></div>` : ''}
          <div class="feature"><div class="fv">${l.sizeText}</div><div class="fl">${sizeStat}</div></div>
          <div class="feature"><div class="fv">${l.area}</div><div class="fl">Covered Area</div></div>
          ${l.yearBuilt ? `<div class="feature"><div class="fv">${l.yearBuilt}</div><div class="fl">Year Built</div></div>` : ''}
          ${l.parking>0 ? `<div class="feature"><div class="fv">${l.parking}</div><div class="fl">Parking</div></div>` : ''}
        </div>
      </div>

      <!-- About -->
      <div class="section">
        <h2 class="section-title">About this property</h2>
        <p class="lead">${l.desc}</p>
      </div>

      <!-- Amenities -->
      <div class="section">
        <h2 class="section-title">Features &amp; amenities</h2>
        <div class="amenity-grid">
          ${l.amenities.map(a => `<div class="amenity">${amenityIcons[a] || amenityIcons['Cupboards Fitted']}<span>${a}</span></div>`).join('')}
        </div>
      </div>

      <!-- Reviews -->
      <div class="section" id="reviews">
        <h2 class="section-title">Buyer reviews of this agent</h2>
        <div class="rev-summary">
          <div class="rev-score">${l.rating}</div>
          <div class="rev-meta">
            <div style="font-weight:700;color:var(--text-high);font-size:14px;">★ ${l.rating}</div>
            <div>Based on ${l.reviews} verified buyer reviews</div>
          </div>
        </div>
        <div class="review-list">
          ${sampleReviews.map(r => `
            <div class="review">
              <div class="ra">
                <div class="av">${r.name.charAt(0)}</div>
                <div><div class="rn">${r.name}</div><div class="rd">${r.date}</div></div>
              </div>
              <p>${r.text}</p>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Location -->
      <div class="section">
        <h2 class="section-title">Location &amp; neighbourhood</h2>
        <p class="lead" style="margin-bottom:14px;">${l.loc}</p>
        <div id="detailMap"></div>
      </div>

      <!-- Agent card -->
      <div class="section" style="border-bottom:0;">
        <h2 class="section-title">Listed by ${l.agent.name}</h2>
        <div class="host-row">
          <div class="host-avatar" style="width:60px;height:60px;font-size:22px;">${l.agent.name.charAt(0)}</div>
          <div>
            <div class="host-meta">
              <strong>${l.agent.name}</strong>
              ${l.agent.agency} · Joined ${l.agent.joined} · ★ ${l.agent.rating} · ${l.agent.listings} listings · ${l.agent.deals} closed deals
            </div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
              ${(l.agent.langs||[]).map(lng=>`<span style="font-size:11px;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--green-faint);color:var(--green);border:1px solid rgba(26,107,42,.18);">${lng}</span>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Contact sidebar -->
    <aside>
      <div class="contact-card">
        <div class="price-head">
          <div class="v">${priceLabel}<span> ${priceSuf}</span></div>
          <div class="r"><span class="star">★</span> ${l.rating}</div>
        </div>
        <div class="price-sub">${l.area} · ${l.sizeText}${l.yearBuilt?' · '+l.yearBuilt:''}</div>

        <div class="agent-block">
          <div class="av">${l.agent.name.charAt(0)}</div>
          <div style="flex:1;min-width:0;">
            <div class="n">${l.agent.name}</div>
            <div class="ag">${l.agent.agency}</div>
            <div class="rt">★ ${l.agent.rating} · ${l.agent.deals} deals</div>
          </div>
        </div>

        <div class="contact-actions">
          <button class="cta-btn cta-call" onclick="PP.toast('Calling ${l.agent.name} — ${l.agent.phone}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.59 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.78a16 16 0 0 0 6.29 6.29l1.04-.87a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Call
          </button>
          <button class="cta-btn cta-wapp" onclick="PP.toast('Opening WhatsApp…')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
            WhatsApp
          </button>
          <button class="cta-btn cta-msg" id="msgBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Email / Message Agent
          </button>
        </div>

        <div class="badges-mini">
          ${(l.badges||[]).map(b => `<span>${b}</span>`).join('')}
        </div>

        <!-- Property summary -->
        <div class="price-rows">
          <div class="r"><span>Type</span><span class="v">${l.type}</span></div>
          <div class="r"><span>${l.purpose==='sale'?'Listed price':'Monthly rent'}</span><span class="v">${PP.fmtFull(l.price)}</span></div>
          <div class="r"><span>Covered area</span><span class="v">${l.area}</span></div>
          <div class="r"><span>Plot size</span><span class="v">${l.sizeText}</span></div>
        </div>

        ${l.purpose==='sale' ? `
        <div class="mort">
          <div class="mhead">Mortgage estimator</div>
          <div class="mrow"><span>Down payment (25%)</span><strong id="dpAmt">—</strong></div>
          <div class="mrow"><span>Loan amount</span><strong id="loanAmt">—</strong></div>
          <div class="mrow"><span>Rate (annual %)</span></div>
          <input id="rate" type="number" value="12" step="0.5" />
          <div class="mrow" style="margin-top:8px;"><span>Term (years)</span></div>
          <input id="term" type="number" value="20" />
          <div class="mtotal"><span>Est. monthly</span><span id="emi">—</span></div>
        </div>` : `
        <div class="mort">
          <div class="mhead">Rent estimator</div>
          <div class="mrow"><span>Monthly rent</span><strong>${PP.fmtFull(l.price)}</strong></div>
          <div class="mrow"><span>Security deposit (2 months)</span><strong>${PP.fmtFull(l.price*2)}</strong></div>
          <div class="mrow"><span>Advance rent (1 month)</span><strong>${PP.fmtFull(l.price)}</strong></div>
          <div class="mtotal"><span>Move-in total</span><span>${PP.fmtFull(l.price*3)}</span></div>
        </div>`}

        <button class="btn btn-primary btn-block btn-lg" id="featuredBtn" style="margin-top:16px;">
          ${l.purpose==='sale' ? 'Book a site visit' : 'Schedule a viewing'}
        </button>
        <div style="font-size:11.5px;color:var(--text-faint);text-align:center;margin-top:8px;">Free · No commitment</div>
      </div>
    </aside>
  </div>
`;

// Mortgage calc
if (l.purpose === 'sale') {
  const dpEl = document.getElementById('dpAmt');
  const lnEl = document.getElementById('loanAmt');
  const rEl  = document.getElementById('rate');
  const tEl  = document.getElementById('term');
  const eEl  = document.getElementById('emi');
  function calcEMI(){
    const dp = l.price * 0.25;
    const loan = l.price - dp;
    const r = (parseFloat(rEl.value)||12) / 12 / 100;
    const n = (parseInt(tEl.value)||20) * 12;
    const emi = Math.round(loan * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1));
    dpEl.textContent = PP.fmtFull(Math.round(dp));
    lnEl.textContent = PP.fmtFull(Math.round(loan));
    eEl.textContent = PP.fmtFull(emi);
  }
  rEl.addEventListener('input', calcEMI);
  tEl.addEventListener('input', calcEMI);
  calcEMI();
}

document.getElementById('msgBtn').addEventListener('click', () => {
  location.href = `/pprealestate/checkout.html?id=${l.id}&action=message`;
});
document.getElementById('featuredBtn').addEventListener('click', () => {
  location.href = `/pprealestate/checkout.html?id=${l.id}&action=visit`;
});

// Leaflet map
const map = L.map('detailMap', { scrollWheelZoom: false }).setView([l.lat, l.lng], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
L.marker([l.lat, l.lng], { icon: PP.pricePin(l.priceLabel, true) }).addTo(map);
</script>
</body>
</html>
